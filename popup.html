<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Citation Hider Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 280px;
      margin: 0;
      padding: 16px;
      color: #333;
      background-color: #f9f9f9;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      border-bottom: 1px solid #eaeaea;
      padding-bottom: 8px;
    }
    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .setting-label {
      font-size: 14px;
      font-weight: 500;
    }
    
    /* Toggle Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:focus + .slider {
      box-shadow: 0 0 1px #4CAF50;
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }
    
    /* Domain List */
    .domain-section {
      margin-top: 16px;
      border-top: 1px solid #eaeaea;
      padding-top: 16px;
    }
    .domain-section h3 {
      font-size: 13px;
      margin: 0 0 12px 0;
      color: #666;
    }
    .domain-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 120px;
      overflow-y: auto;
    }
    .domain-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #F44336;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .remove-btn:hover {
      background-color: #ffebee;
      border-radius: 2px;
    }
    
    /* Quick Add Button */
    .quick-add-container {
      margin-top: 12px;
      display: none; /* Hidden by default */
    }
    .quick-add-btn {
      width: 100%;
      background-color: #2196F3;
      color: white;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .quick-add-btn:hover {
      background-color: #1976D2;
    }
  </style>
</head>
<body>
  <h2>Citation Hider</h2>
  
  <div class="setting-row">
    <span class="setting-label">Hide Citations</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitch">
      <span class="slider"></span>
    </label>
  </div>

  <div class="domain-section">
    <h3>Active Domains</h3>
    <ul class="domain-list" id="domainList">
      <!-- Domain items injected here -->
    </ul>
    
    <div class="quick-add-container" id="quickAddContainer">
      <button class="quick-add-btn" id="quickAddBtn">
        <span>➕</span> Add <span id="currentDomainText">this site</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
